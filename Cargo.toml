[package]
name = "jarvis_assist_agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jaa"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1.10"
chrono = "0.4"
base64 = "0.22"
crossterm = "0.28"
walkdir = "2.5"
bytes = "1.6"
futures-util = "0.3"
byteorder = "1.5"

[build-dependencies]
winres = "0.1"
